[package]
name = "twrite-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "GPUI rendering, canvas text-shaping, and editor component for twrite"
readme = "../../README.md"

[dependencies]
gpui = { workspace = true }
twrite-core = { workspace = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[features]
default = []
markdown = ["twrite-core/markdown"]
# Enables compatibility with newer GPUI API signatures.
gpui-latest-api = []
