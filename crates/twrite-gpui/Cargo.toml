[package]
name = "twrite-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "GPUI rendering, canvas text-shaping, and editor component for twrite"
readme = "../../README.md"

[dependencies]
gpui = { workspace = true }
twrite-core = { workspace = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[features]
default = []
markdown = ["twrite-core/markdown"]
# Post-0.2.2 GPUI ABI (gpui-ce, zed v1.0+, bezel 0.3.12+). Remove when gpui crates-io moves past 0.2.2.
gpui-new-api = []
