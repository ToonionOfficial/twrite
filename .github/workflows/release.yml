name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate-and-release:
    name: Validate & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libxkbcommon-dev

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy Lint
        # Enumerated, not --all-features: gpui-new-api only compiles against
        # a patched GPUI (zed/bezel), so enabling it with registry gpui fails.
        run: cargo clippy --all-targets --features markdown,wayland,x11,font-kit -- -D warnings

      - name: Run Tests
        run: cargo test --workspace

      - name: Verify Examples Compile
        run: cargo check --workspace --examples

      - name: Publish to crates.io
        # One crate at a time, in dependency order, each with retries.
        # A single `cargo publish --workspace` aborts the whole release when
        # the registry index lags behind an upload (as happened for 0.18.0:
        # twrite-core uploaded, then the 60s wait for it timed out and the
        # other two crates never published). Per-crate steps resume cleanly,
        # and already-published versions are treated as done.
        run: |
          publish_crate() {
            local package="$1"
            local output=""
            local attempts=5
            local attempt=1
            while [ "$attempt" -le "$attempts" ]; do
              if output=$(cargo publish -p "$package" --locked 2>&1); then
                echo "$output"
                return 0
              fi
              echo "$output"
              if echo "$output" | grep -qiE "already published|already exists"; then
                echo "$package already published; continuing."
                return 0
              fi
              if [ "$attempt" -lt "$attempts" ]; then
                echo "Publish of $package failed (attempt $attempt/$attempts); retrying in 60s..."
                sleep 60
              fi
              attempt=$((attempt + 1))
            done
            return 1
          }
          publish_crate twrite-core
          publish_crate twrite-gpui
          publish_crate twrite
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
