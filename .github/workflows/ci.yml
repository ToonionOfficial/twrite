name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rust-checks:
    name: Rust Checks & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libxkbcommon-dev

      - name: Install Testing Utility
        run: cargo install cargo-hack

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy Lint
        run: cargo hack clippy --all-targets --workspace --feature-powerset --exclude-features gpui-zed-1-0 -- -D warnings

      - name: Run Tests
        run: cargo hack test --all-targets --workspace --feature-powerset --exclude-features gpui-zed-1-0

      - name: Run GPUI Compatibility Tests
        run: |
          pushd examples/gpui-zed-1-0
          cargo build --all-targets --all-features
          popd

          pushd examples/gpui-zed-latest
          cargo build --all-targets --all-features
          popd
