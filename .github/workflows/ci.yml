name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rust-checks:
    name: Rust Checks & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libxkbcommon-dev

      - name: Install Testing Utility
        run: cargo install cargo-hack

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy Lint
        run: cargo hack clippy --all-targets --workspace --feature-powerset --exclude-features gpui-new-api -- -D warnings

      - name: Run Tests
        # Bounded selection: linking every example test binary in each
        # powerset combo exhausts the runner (ld bus error), and plain
        # `cargo test` builds examples unconditionally. Lib, integration,
        # and doc tests run here per single feature; full-combo compile
        # coverage comes from Check All Targets below.
        run: cargo hack test --lib --tests --workspace --feature-powerset --depth 1 --exclude-features gpui-new-api

      - name: Run Doc Tests
        run: cargo hack test --doc --workspace --feature-powerset --depth 1 --exclude-features gpui-new-api

      - name: Check All Targets
        run: cargo hack check --workspace --all-targets --feature-powerset --exclude-features gpui-new-api

      - name: Run GPUI Compatibility Tests
        run: |
          pushd examples/gpui-compat-zed
          cargo build --all-targets --all-features
          popd
